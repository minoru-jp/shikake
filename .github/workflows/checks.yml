name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Run shared checks
        run: make check

  sdist:
    name: Verify extracted source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
      - name: Verify checks from extracted sdist
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$archive"
          extracted=$(mktemp -d)
          tar -xzf "$archive" -C "$extracted"
          cd "$extracted"/shikake-*
          python -m pip install -e '.[dev]'
          python -m pip check
          make check
